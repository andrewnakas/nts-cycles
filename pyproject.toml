[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nts-cycles"
version = "0.2.0"
description = "Temporal neural rendering for Blender Cycles frame sequences: realism pass (NR-1), temporal upscaling (NTS-F), frame generation (NTS-G)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.optional-dependencies]
exr = ["OpenImageIO>=2.5"]                      # reading Cycles EXR passes (nts.io_exr); Blender's own Python has it
eval = ["opencv-python-headless>=4.8", "scipy>=1.10"]   # eval/flicker_flow.py, eval/scoreboard.py, eval/face_levers.py
dev = ["pytest>=7"]
rt = ["wgpu>=0.33"]                             # nts/rt: the upscaler on the GPU (WGSL via wgpu: Metal, Vulkan, D3D12)
rt-view = ["wgpu>=0.33", "glfw>=2.7"]           # nts/rt/view.py's window (--record needs ffmpeg instead)

[tool.setuptools.packages.find]
include = ["nts*", "gen*", "baselines*", "eval*"]

[tool.setuptools.package-data]
"nts.rt" = ["shaders/*.wgsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
